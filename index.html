<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>J-Velo | Be the Bridge</title>
<meta name="description" content="J-Velo: Japanese pitching velocity program. Video analysis and online coaching from a Japanese pitching coach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow reading column; a radar-readout panel is the signature; bands separated by stitched seams */
:root{
  --bg:#F5F7F3; --surface:#FFFFFF; --ink:#14231F; --muted:#56655F; --line:#D9E0DA;
  --seam:#C8102E; --panel:#10201B; --panel-ink:#E9F2EC; --readout:#7CF2B0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#15211D; --ink:#E6EEE9; --muted:#9AAAA3; --line:#26352F;
  --seam:#F0445C; --panel:#08110E; --panel-ink:#E6EEE9; --readout:#7CF2B0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#15211D; --ink:#E6EEE9; --muted:#9AAAA3; --line:#26352F;
  --seam:#F0445C; --panel:#08110E; --panel-ink:#E6EEE9; --readout:#7CF2B0; color-scheme:dark}
html:lang(ko) body{font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:0}
.wrap{max-width:880px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--seam);outline-offset:3px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:20px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--seam)}
.langs{display:flex;gap:4px}
.langs button{font:500 13px var(--f-mono);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding-block:48px 40px}
.hero>*{min-width:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--seam);margin:0 0 12px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5.6vw,52px);line-height:1.05;text-transform:uppercase;margin:0 0 16px;text-wrap:balance}
.lede{color:var(--muted);font-size:17px;margin:0 0 24px;max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:6px;border:2px solid var(--ink)}
.btn.primary{background:var(--seam);border-color:var(--seam);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}

.readout{background:var(--panel);color:var(--panel-ink);border-radius:10px;padding:20px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.readout .row{display:flex;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:1px dashed rgba(124,242,176,.25)}
.readout .row:last-of-type{border-bottom:0}
.readout .k{font-size:12px;letter-spacing:.1em;opacity:.7}
.readout .v{color:var(--readout);font-size:18px}
.readout .big{font-family:var(--f-display);font-weight:800;font-size:48px;color:var(--readout);line-height:1;margin:6px 0 2px}
.readout .note{font-size:11px;opacity:.6;margin-top:10px;font-family:var(--f-body)}

.seam{height:14px;margin-block:8px;background:
  repeating-linear-gradient(115deg,transparent 0 10px,var(--seam) 10px 12px,transparent 12px 20px) top/100% 6px no-repeat,
  linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat;opacity:.9}

section{padding-block:40px}
h2{font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 20px;text-wrap:balance}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid2>*{min-width:0}
.cred{border-top:2px solid var(--ink);padding-top:12px}
.cred b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.cred p{margin:4px 0 0;color:var(--muted);font-size:15px}
ul.for{margin:0;padding-left:1.2em}
ul.for li{margin-block:6px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
ol.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
ol.steps li::before{content:counter(s);display:block;font:800 28px var(--f-display);color:var(--seam)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.p{font-family:var(--f-mono);font-size:17px}
.small{color:var(--muted);font-size:14px;margin-top:12px}
.guarantee{border:2px solid var(--seam);border-radius:8px;padding:16px 20px;margin-top:20px}
.guarantee b{color:var(--seam)}
footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding-block:32px}
  .grid2,ol.steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .readout .big{animation:tick .9s ease-out both}
  @keyframes tick{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">J-Velo <span>|</span> Be the Bridge</div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko" id="lang-ko">한국어</button>
      <button type="button" data-lang="en" id="lang-en">EN</button>
      <button type="button" data-lang="ja" id="lang-ja">日本語</button>
    </div>
  </header>

  <div class="hero">
    <div>
      <p class="eyebrow" data-i="eyebrow"></p>
      <h1 data-i="h1"></h1>
      <p class="lede" data-i="lede"></p>
      <div class="cta">
        <a class="btn primary" href="https://ig.me/m/neolab.boda" target="_blank" rel="noopener" data-i="cta"></a>
        <a class="btn ghost" href="#pricing" data-i="cta2"></a>
      </div>
    </div>
    <div class="readout" aria-label="Rapsodo sample readout">
      <div class="k">RAPSODO · FASTBALL · 12 WKS</div>
      <div class="big">139<small style="font-size:20px"> km/h</small></div>
      <div class="row"><span class="k">BEFORE</span><span class="v">128 km/h · 79.5 mph</span></div>
      <div class="row"><span class="k">AFTER</span><span class="v">139 km/h · 86.4 mph</span></div>
      <div class="row"><span class="k">GAIN</span><span class="v">+11 km/h</span></div>
      <div class="note" data-i="sample"></div>
    </div>
  </div>

  <div class="seam" aria-hidden="true"></div>

  <section id="coach">
    <h2 data-i="coachH"></h2>
    <div class="grid2">
      <div class="cred"><b>NPB · KBO</b><p data-i="c1"></p></div>
      <div class="cred"><b>NASM-PES</b><p data-i="c2"></p></div>
      <div class="cred"><b>Rapsodo</b><p data-i="c3"></p></div>
      <div class="cred"><b data-i="c4h"></b><p data-i="c4"></p></div>
    </div>
  </section>

  <section id="for">
    <h2 data-i="forH"></h2>
    <ul class="for">
      <li data-i="f1"></li><li data-i="f2"></li><li data-i="f3"></li><li data-i="f4"></li>
    </ul>
  </section>

  <section id="how">
    <h2 data-i="howH"></h2>
    <ol class="steps">
      <li data-i="s1"></li><li data-i="s2"></li><li data-i="s3"></li>
    </ol>
  </section>

  <section id="watch">
    <h2 data-i="watchH"></h2>
    <p data-i="watch"></p>
    <div class="cta">
      <a class="btn ghost" href="https://www.tiktok.com/@neolab.boda" target="_blank" rel="noopener">TikTok @neolab.boda</a>
      <a class="btn ghost" href="https://www.instagram.com/neolab.boda/" target="_blank" rel="noopener">Instagram @neolab.boda</a>
    </div>
  </section>

  <section id="pricing">
    <h2 data-i="priceH"></h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th data-i="tPlan"></th><th data-i="tAdult"></th><th data-i="tKid"></th></tr></thead>
        <tbody>
          <tr><td data-i="pSingle"></td><td class="p" data-i="pS1"></td><td class="p" data-i="pS2"></td></tr>
          <tr><td data-i="pMonthly"></td><td class="p" data-i="pM1"></td><td class="p" data-i="pM2"></td></tr>
          <tr><td data-i="pLive"></td><td class="p" data-i="pL1"></td><td class="p" data-i="pL2"></td></tr>
        </tbody>
      </table>
    </div>
    <p class="small" data-i="kidNote"></p>
    <div class="guarantee"><b data-i="gH"></b> <span data-i="g"></span></div>
    <p class="small" data-i="notes"></p>
  </section>

  <footer>
    <span>© J-Velo · Be the Bridge</span>
    <span class="social"><a href="https://www.instagram.com/neolab.boda/" target="_blank" rel="noopener">Instagram @neolab.boda</a> · <a href="https://www.tiktok.com/@neolab.boda" target="_blank" rel="noopener">TikTok @neolab.boda</a></span>
  </footer>
</div>

priceH:"요금",tPlan:"플랜",tAdult:"고등학생 이상",tKid:"초·중학생",pSingle:"1회 피드백",pMonthly:"월 4회 플랜",pLive:"라이브 지도 (60분, 통역 포함)",

pS1:"$99",pS2:"$79",pM1:"$299 / month",pM2:"$239 / month",pL1:"$149",pL2:"$119",
kidNote:"For younger players, we focus on proper mechanics and injury prevention rather than chasing velocity.",gH:"First-analysis guarantee.",g:"Not satisfied with your first analysis? You get a full refund.",
watchH:"Free drills",watch:"Velocity drills and coaching breakdowns, posted every week on TikTok and Instagram.",notes:"Players under 18 need a parent's or guardian's consent. Videos are used only for coaching; results are shared only with permission, as numbers, never names or video."},

function setLang(l){
  if(!T[l]) l="en";
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[l][el.dataset.i]; if(v!==undefined) el.textContent=v;});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  try{localStorage.setItem("jvelo-lang",l)}catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let start="ko";
try{const s=localStorage.getItem("jvelo-lang"); if(s) start=s; else {const n=(navigator.language||"").slice(0,2); if(T[n]) start=n; else start="en";}}catch(e){}
setLang(start);

</body>
</html>
