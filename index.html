<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BE THE BRIDGE | J-Velo</title>
<meta name="description" content="BE THE BRIDGE: J-Velo, a Japanese pitching velocity program by Yudai Boda. Video analysis and online coaching from Japan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single column on paper, a vertical kanji spine at the left edge, one vermilion arch (a taiko bridge and a pitch's flight) as the only ornament */
:root{
  --paper:#F6F6F3; --sumi:#141414; --ink2:#5C5A57; --rule:#DEDCD7;
  --shu:#C8361E; --shu-ink:#FFFFFF; --surface:#FFFFFF;
  --f-mincho:"Shippori Mincho B1","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Noto Sans JP","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121212; --sumi:#EDECE8; --ink2:#A3A09A; --rule:#2C2B29;
  --shu:#E4553A; --shu-ink:#121212; --surface:#1A1A19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121212; --sumi:#EDECE8; --ink2:#A3A09A; --rule:#2C2B29;
  --shu:#E4553A; --shu-ink:#121212; --surface:#1A1A19; color-scheme:dark}

html:lang(ko) body{font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
body{background:var(--paper);color:var(--sumi);font-family:var(--f-body);font-size:16px;line-height:1.8;padding-inline:16px;padding-block:0}
.wrap{max-width:960px;margin:0 auto;position:relative}
a{color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:3px}

/* header */
header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:24px}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none}
.hanko{width:40px;height:40px;flex:none;background:var(--shu);color:var(--shu-ink);display:grid;place-items:center;border-radius:4px;font:800 14px/1.05 var(--f-mincho);writing-mode:vertical-rl;letter-spacing:.05em}
.wordmark{display:flex;flex-direction:column;line-height:1.15}
.wordmark b{font:700 17px var(--f-mincho);letter-spacing:.22em}
.wordmark small{font:400 11px var(--f-mono);letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.langs{display:flex;gap:2px}
.langs button{font:500 12px var(--f-mono);background:transparent;color:var(--ink2);border:0;border-bottom:1px solid transparent;padding:6px 8px;cursor:pointer;letter-spacing:.06em}
.langs button[aria-pressed="true"]{color:var(--sumi);border-bottom-color:var(--shu)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,5vw,56px);padding-block:clamp(40px,8vw,88px) 24px}
.hero>*{min-width:0}
.spine{writing-mode:vertical-rl;font:800 clamp(40px,7vw,72px)/1 var(--f-mincho);color:var(--shu);letter-spacing:.12em;margin:0;user-select:none}
.spine span{display:block;font:500 12px var(--f-mono);letter-spacing:.3em;color:var(--ink2);margin-right:12px;text-transform:uppercase}
.origin{font:500 12px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin:0 0 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.origin i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--shu)}
h1{font:700 clamp(30px,4.8vw,50px)/1.35 var(--f-mincho);margin:0 0 24px;text-wrap:balance;letter-spacing:.01em}
.lede{color:var(--ink2);font-size:16px;margin:0 0 32px;max-width:36em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:500;font-size:15px;padding:13px 24px;border:1px solid var(--sumi);letter-spacing:.04em}
.btn.primary{background:var(--shu);border-color:var(--shu);color:var(--shu-ink)}
.btn.ghost{background:transparent;color:var(--sumi)}
.btn:hover{opacity:.88}

/* the arch */
.arch{display:block;width:100%;height:auto;max-width:100%;margin-block:8px 0}
.arch path{fill:none;stroke:var(--shu);stroke-width:2.5;stroke-linecap:round}
.arch line{stroke:var(--rule);stroke-width:1}
.arch circle{fill:var(--shu)}
@media (prefers-reduced-motion:no-preference){
  .arch path{stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 1.6s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
}

/* proof */
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:8px 48px;font-variant-numeric:tabular-nums}
.proof>div{min-width:0;border-top:1px solid var(--sumi);padding-top:14px}
.proof .k{font:500 11px var(--f-mono);letter-spacing:.18em;color:var(--ink2);text-transform:uppercase}
.proof .v{font:700 clamp(30px,5vw,44px)/1.1 var(--f-mincho);margin-top:6px}
.proof .v small{font:400 13px var(--f-mono);color:var(--ink2);margin-left:6px}
.proof .gain .v{color:var(--shu)}
.proof-note{grid-column:1/-1;font-size:12px;color:var(--ink2);margin:0}

/* sections */
section{padding-block:56px;border-top:1px solid var(--rule);display:grid;grid-template-columns:180px 1fr;gap:24px}
section>*{min-width:0}
.sh{margin:0}
.sh .kanji{display:block;font:800 30px/1 var(--f-mincho);color:var(--shu);letter-spacing:.1em;margin-bottom:10px}
.sh h2{font:700 18px/1.4 var(--f-mincho);margin:0;letter-spacing:.04em;text-wrap:balance}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 32px}
.grid2>*{min-width:0}
.cred b{display:block;font:700 20px var(--f-mincho);letter-spacing:.06em}
.cred p{margin:4px 0 0;color:var(--ink2);font-size:15px}
ul.for{margin:0;padding:0;list-style:none;display:grid;gap:12px}
ul.for li{padding-left:22px;position:relative}
ul.for li::before{content:"";position:absolute;left:0;top:.8em;width:10px;height:1px;background:var(--shu)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:s}
ol.steps li{counter-increment:s;min-width:0;font-size:15px}
ol.steps li::before{content:counter(s,cjk-ideographic);display:block;font:800 26px var(--f-mincho);color:var(--shu);margin-bottom:6px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:14px 12px 14px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
td.p{font:500 18px var(--f-mincho)}
.small{color:var(--ink2);font-size:14px;margin:14px 0 0}
.guarantee{display:flex;gap:14px;align-items:flex-start;margin-top:24px;padding:18px 20px;background:var(--surface);border:1px solid var(--rule)}
.guarantee .seal{flex:none;width:34px;height:34px;border:2px solid var(--shu);color:var(--shu);display:grid;place-items:center;font:800 15px var(--f-mincho);border-radius:50%}
.guarantee b{display:block;font-family:var(--f-mincho)}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}

footer{border-top:1px solid var(--sumi);padding-block:32px 48px;color:var(--ink2);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .fmark{font:700 14px var(--f-mincho);letter-spacing:.2em;color:var(--sumi)}

@media (max-width:720px){
  section{grid-template-columns:1fr;gap:20px}
  .grid2,ol.steps{grid-template-columns:1fr}
  .proof{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
}
@media (max-width:440px){
  .hero{grid-template-columns:1fr}
  .spine{writing-mode:horizontal-tb;font-size:34px}
  .spine span{display:inline;margin:0 0 0 10px}
}
</style>
</head>
<body>

  <section id="for">

  <section id="how">

function setLang(l){
  if(!T[l]) l="en";
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[l][el.dataset.i]; if(v!==undefined) el.textContent=v;});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
  try{localStorage.setItem("jvelo-lang",l)}catch(e){}
